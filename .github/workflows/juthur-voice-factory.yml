name: Juthur Voice Factory

on:
  push:
    branches: [claude/audio-content-juthoor-26reta]
    paths:
      - "audio_factory/scripts/**"
      - "audio_factory/reference/**"
      - "audio_factory/ambience.tsv"
      - ".github/workflows/juthur-voice-factory.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  RECIPE_VERSION: v7

concurrency:
  group: juthur-voice-factory
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.plan.outputs.scripts }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/audio-content-juthoor-26reta
      - id: plan
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import glob
          import hashlib
          import json
          import os

          rv = os.environ["RECIPE_VERSION"]
          amb = {}
          if os.path.exists("audio_factory/ambience.tsv"):
              for line in open("audio_factory/ambience.tsv", encoding="utf-8"):
                  if "\t" in line:
                      k, v = line.rstrip("\n").split("\t", 1)
                      amb[k] = v

          def recipe_hash(name, path):
              d = hashlib.sha256()
              d.update(rv.encode())
              with open(path, "rb") as f:
                  d.update(f.read())
              d.update(amb.get(name, "").encode())
              return d.hexdigest()[:16]

          pending = []
          for path in sorted(glob.glob("audio_factory/scripts/*.txt")):
              name = os.path.splitext(os.path.basename(path))[0]
              sha_path = f"audio_factory/output/{name}.sha"
              expected = recipe_hash(name, path)
              current = (
                  open(sha_path).read().strip()
                  if os.path.exists(sha_path)
                  else ""
              )
              if current != expected or not os.path.exists(
                  f"audio_factory/output/{name}.mp3"
              ):
                  pending.append(name)
          print(f"scripts={json.dumps(pending)}")
          print(f"count={len(pending)}")
          PYEOF

  generate:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        script: ${{ fromJson(needs.plan.outputs.scripts) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/audio-content-juthoor-26reta

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Chatterbox TTS
        run: pip install --quiet chatterbox-tts

      - name: Prepare reference audio
        run: |
          mkdir -p audio_factory/work audio_factory/output
          ffmpeg -y -loglevel error -ss 10 -t 25 \
            -i audio_factory/reference/adel_ref.m4a \
            -ar 24000 -ac 1 audio_factory/work/adel_ref.wav
          ffmpeg -y -loglevel error -ss 10 -t 25 \
            -i audio_factory/reference/adel_ref_en.m4a \
            -ar 24000 -ac 1 audio_factory/work/adel_ref_en.wav

      - name: Generate voice clip
        env:
          SCRIPT_NAME: ${{ matrix.script }}
        run: |
          cat > audio_factory/work/generate_clip.py <<'PYEOF'
          import hashlib
          import os
          import re

          import torch
          import torchaudio
          from chatterbox.mtl_tts import ChatterboxMultilingualTTS

          name = os.environ["SCRIPT_NAME"]
          rv = os.environ["RECIPE_VERSION"]
          lang = "ar" if name.upper().endswith("_AR") else "en"
          ref = (
              "audio_factory/work/adel_ref.wav"
              if lang == "ar"
              else "audio_factory/work/adel_ref_en.wav"
          )
          MAX_CHUNK = 180

          def jitter(base, i):
              frac = ((i + 1) * 2654435761 % 100) / 100.0
              return base * (0.85 + 0.3 * frac)

          def breath_groups(text):
              """Yield (chunk, pause_after_seconds): comma-split inside long
              sentences (short pause), sentence pauses inside a paragraph
              (medium), paragraph pauses (long) — like a reader breathing."""
              groups = []
              paragraphs = [p.strip() for p in text.split("\n") if p.strip()]
              for p in paragraphs:
                  sentences = re.split(r"(?<=[.!?؟…:])\s+", p)
                  merged, cur = [], ""
                  for s in sentences:
                      if len(cur) + len(s) + 1 <= MAX_CHUNK:
                          cur = f"{cur} {s}".strip()
                      else:
                          if cur:
                              merged.append(cur)
                          cur = s
                  if cur:
                      merged.append(cur)
                  for k, chunk in enumerate(merged):
                      if len(chunk) > 220:
                          subs = re.split(r"(?<=[،,—])\s+", chunk)
                          for m, sub in enumerate(subs):
                              last_sub = m == len(subs) - 1
                              last_chunk = k == len(merged) - 1
                              if not last_sub:
                                  pause = 0.25
                              elif last_chunk:
                                  pause = 0.85
                              else:
                                  pause = 0.55
                              groups.append((sub, pause))
                      else:
                          groups.append(
                              (chunk, 0.85 if k == len(merged) - 1 else 0.55)
                          )
              return groups

          def edge_fade(wav, sr, ms=40):
              n = min(int(sr * ms / 1000), wav.shape[1] // 4)
              if n > 0:
                  ramp = torch.linspace(0.0, 1.0, n)
                  wav[:, :n] *= ramp
                  wav[:, -n:] *= ramp.flip(0)
              return wav

          with open(f"audio_factory/scripts/{name}.txt", encoding="utf-8") as f:
              raw_text = f.read()
          text = re.sub(r"\[[^\]]*\]", " ", raw_text).strip()

          model = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
          pieces = []
          exaggeration = 0.45 if lang == "ar" else 0.4
          for i, (chunk, pause_s) in enumerate(breath_groups(text)):
              print(f"{name} [{lang}] chunk {i + 1}: {len(chunk)} chars, pause {pause_s}", flush=True)
              wav = model.generate(
                  chunk,
                  language_id=lang,
                  audio_prompt_path=ref,
                  exaggeration=exaggeration,
                  cfg_weight=0.35,
                  temperature=0.7,
              )
              pieces.append(edge_fade(wav, model.sr))
              pieces.append(torch.zeros(1, int(jitter(pause_s, i) * model.sr)))
          out = f"audio_factory/work/{name}_raw.wav"
          torchaudio.save(out, torch.cat(pieces[:-1], dim=1), model.sr)

          amb = {}
          if os.path.exists("audio_factory/ambience.tsv"):
              for line in open("audio_factory/ambience.tsv", encoding="utf-8"):
                  if "\t" in line:
                      k, v = line.rstrip("\n").split("\t", 1)
                      amb[k] = v
          d = hashlib.sha256()
          d.update(rv.encode())
          d.update(raw_text.encode("utf-8"))
          d.update(amb.get(name, "").encode())
          os.makedirs("audio_factory/output", exist_ok=True)
          with open(f"audio_factory/output/{name}.sha", "w") as f:
              f.write(d.hexdigest()[:16])
          print(f"done: {out}")
          PYEOF
          python audio_factory/work/generate_clip.py

      - name: Master and mix ambience
        env:
          SCRIPT_NAME: ${{ matrix.script }}
        run: |
          set -euo pipefail
          name="$SCRIPT_NAME"
          raw="audio_factory/work/${name}_raw.wav"
          voiced="audio_factory/work/${name}_mastered.wav"
          MASTER_CHAIN="highpass=f=70,bass=g=2:f=140,treble=g=-1.5:f=9000,deesser,acompressor=threshold=-21dB:ratio=2.5:attack=15:release=250:makeup=3,loudnorm=I=-20:TP=-3.5:LRA=7"
          ffmpeg -y -loglevel error -i "$raw" -af "$MASTER_CHAIN" -ar 24000 -ac 1 "$voiced"

          amb="$(awk -F'\t' -v n="$name" '$1==n{print $2}' audio_factory/ambience.tsv || true)"
          if [ -z "$amb" ]; then
            case "$name" in *_AR) amb="rain" ;; *) amb="forest" ;; esac
          fi
          case "$amb" in
            rain)   bedsrc="anoisesrc=color=pink:sample_rate=24000:duration=%DUR%,highpass=f=400,lowpass=f=9000" ;;
            wind)   bedsrc="anoisesrc=color=brown:sample_rate=24000:duration=%DUR%,lowpass=f=850,tremolo=f=0.15:d=0.6" ;;
            waves)  bedsrc="anoisesrc=color=brown:sample_rate=24000:duration=%DUR%,lowpass=f=1200,tremolo=f=0.1:d=0.9" ;;
            forest) bedsrc="anoisesrc=color=brown:sample_rate=24000:duration=%DUR%,lowpass=f=2000,tremolo=f=0.2:d=0.5" ;;
            oud)    bedsrc="anoisesrc=color=brown:sample_rate=24000:duration=%DUR%,lowpass=f=700,tremolo=f=0.1:d=0.5" ;;
            *)      bedsrc="anoisesrc=color=brown:sample_rate=24000:duration=%DUR%,lowpass=f=850,tremolo=f=0.15:d=0.6" ;;
          esac

          dur="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$voiced")"
          total="$(python3 -c "print(float('$dur') + 4.0)")"
          fade_out_start="$(python3 -c "print(float('$total') - 2.5)")"
          bed="$(echo "$bedsrc" | sed "s/%DUR%/$total/")"

          ffmpeg -y -loglevel error -i "$voiced" -filter_complex \
            "[0:a]adelay=1500|1500,apad=pad_dur=2.5[v];
             ${bed},volume=0.035,afade=t=in:d=1.5,afade=t=out:st=${fade_out_start}:d=2.5[b];
             [v][b]amix=inputs=2:duration=longest:normalize=0[out]" \
            -map "[out]" -ar 44100 -ac 1 "audio_factory/output/${name}.wav"
          ffmpeg -y -loglevel error -i "audio_factory/output/${name}.wav" -codec:a libmp3lame -b:a 192k -ar 44100 -ac 1 "audio_factory/output/${name}.mp3"
          echo "mastered [$amb]: ${name}"
          echo "--- ACX QC (target: RMS -23..-18 dBFS, peak <= -3 dBFS) ---"
          ffmpeg -i "audio_factory/output/${name}.mp3" -af astats=measure_overall=RMS_level+Peak_level:measure_perchannel=none -f null - 2>&1 | grep -E "RMS level|Peak level" || true

      - name: Upload clip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.script }}
          path: |
            audio_factory/output/${{ matrix.script }}.wav
            audio_factory/output/${{ matrix.script }}.mp3
            audio_factory/output/${{ matrix.script }}.sha

  collect:
    needs: [plan, generate]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/audio-content-juthoor-26reta

      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          path: audio_factory/output/
          merge-multiple: true

      - name: Commit outputs back to branch
        run: |
          git config user.name "juthur-voice-factory"
          git config user.email "actions@users.noreply.github.com"
          git add -f audio_factory/output/
          git commit -m "Juthur voice factory output [skip ci]" || echo "nothing to commit"
          git pull --rebase origin claude/audio-content-juthoor-26reta || true
          git push origin HEAD:claude/audio-content-juthoor-26reta
